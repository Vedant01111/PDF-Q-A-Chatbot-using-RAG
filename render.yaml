# NOTE on the free plan: free services have NO persistent disk. Uploaded PDFs
# and their FAISS indexes live only in the container's ephemeral filesystem,
# so they're wiped whenever the backend restarts, redeploys, or spins back up
# after sleeping. Conversation history is safe (it's in Postgres, not on disk).
# If you want uploads to survive restarts, upgrade pdfqa-backend to a paid
# plan and add a `disk:` block mounted at /app/backend/data.

services:
  - type: pserv
    name: pdfqa-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false   # set this manually in the Render dashboard — see README
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false   # set this manually in the Render dashboard after first deploy
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: TOP_K
        value: "4"

  - type: web
    name: pdfqa-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          type: pserv
          name: pdfqa-backend
          property: hostport