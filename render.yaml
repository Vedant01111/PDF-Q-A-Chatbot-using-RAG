services:
  - type: web
    name: pdfqa-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: TOP_K
        value: "4"

  -   - type: web
        name: pdfqa-frontend
        runtime: docker
        dockerfilePath: frontend/Dockerfile
        dockerContext: .
        plan: free
        envVars:
      -     key: BACKEND_URL
            fromService:
            type: web
            name: pdfqa-backend
            envVarKey: RENDER_EXTERNAL_URL